name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          {
            echo '## Kotlin errors (compact)'
            echo '```'
            grep -E '^e: ' build.log | sed -E 's#file:///[^ ]*/com/carfam/wakeuppro/##' | cut -c1-160 | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: WakeUpPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WAKEUP PRO build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
